[package]
name = "easy-diff"
version = "0.1.0"
edition = "2021"
description = "LLM-powered PR review tool"

[[bin]]
name = "easy-diff"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
git2 = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
dirs = "5"
jsonschema = "0.46.5"
dialoguer = "0.11"
atty = "0.2"
libc = "0.2"
tauri = { version = "2.11.2", optional = true, features = [] }
rfd = { version = "0.17.2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"

[features]
gui = ["dep:tauri", "dep:tauri-build", "dep:rfd"]
